name: Deploy SvelteKit to GitHub Pages

on:
  push:
    branches: ['main'] # Pastikan nama branch kamu benar (main atau master)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Menggunakan Bun karena kamu install via Bun di lokal
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Install dependencies menggunakan Bun
      - name: Install Dependencies
        run: bun install

      # Build project menggunakan Bun
      - name: Build Project
        run: bun run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Ubah ke './dist' jika kamu pakai murni Vite (bukan SvelteKit)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4