name: Deploy Website

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ========================================
      # Main Website
      # ========================================

      - name: Checkout Main Website
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Main Dependencies
        run: bun install

      - name: Build Main Website
        run: bun run build

      # ========================================
      # HorizonPOS
      # ========================================

      - name: Checkout HorizonPOS
        uses: actions/checkout@v4
        with:
          repository: horizon-noz/HorizonPOS-WebAdmin
          path: horizonpos

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: horizonpos/package-lock.json

      - name: Install HorizonPOS Dependencies
        working-directory: horizonpos
        run: npm ci

      - name: Build HorizonPOS
        working-directory: horizonpos
        run: npm run build

      # ========================================
      # Merge HorizonPOS into Main Build
      # ========================================

      - name: Copy HorizonPOS
        run: |
          rm -rf build/horizonpos
          mkdir -p build/horizonpos
          cp -r horizonpos/dist/. build/horizonpos/

      # ========================================
      # Upload GitHub Pages Artifact
      # ========================================

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./build

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
